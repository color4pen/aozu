name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "specrunner/changes/**"
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: tsc --noEmit

      - name: Test
        run: bun test

      - name: Self-check (closure verification)
        run: bun src/cli/main.ts check --dir design

      - name: Self-check (rules sync verification)
        run: bun src/cli/main.ts export rules --dir design --verify
